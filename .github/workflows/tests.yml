name: Build FIFA 22 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free Disk Space on macOS Runner
        run: |
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf /Library/Developer/CoreSimulator/Volumes/*
          sudo rm -rf /Library/Developer/CoreSimulator/Caches/*
          brew cleanup --prune=0 2>/dev/null || true
          df -h

      - name: Install Build Dependencies & gdown
        run: |
          python3 -m pip install --upgrade pip gdown
          brew install cmake ninja

      - name: Download Keys, Base Game, and Update from Google Drive
        run: |
          mkdir -p ~/GameInput ~/Keys
          
          # Download prod.keys
          gdown --fuzzy "${{ secrets.PROD_KEYS_URL }}" -O ~/Keys/prod.keys
          
          # Download 13GB Base Game (.nsp)
          gdown --fuzzy "${{ secrets.BASE_NSP_URL }}" -O ~/GameInput/fifa22_base.nsp
          
          # Download Game Update (.nsp)
          gdown --fuzzy "${{ secrets.UPDATE_NSP_URL }}" -O ~/GameInput/fifa22_update.nsp
          
          # Verify real files were downloaded (not Google Drive HTML warning pages)
          for f in ~/GameInput/* ~/Keys/*; do
            if head -c 100 "$f" | grep -qi "<!DOCTYPE html>"; then
              echo "ERROR: $f is an HTML webpage! Check 'Anyone with the link' in Google Drive."
              exit 1
            fi
          done
          
          ls -lh ~/GameInput ~/Keys

      - name: Build IPA from NSP
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/GameInput -k ~/Keys/prod.keys --romfs separate

      - name: Upload Compiled IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FIFA22-IPA
          path: "**/*.ipa"
          retention-days: 5

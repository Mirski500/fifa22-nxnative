name: Build FIFA 22 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Free up disk space on runner
        run: |
          sudo rm -rf /Applications/Xcode_15*.app
          sudo rm -rf /Users/runner/Library/Android
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen zstd glslang unrar
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic gdown

      - name: Download game files, update, and keys
        env:
          GAME_URL: ${{ secrets.GAME_NSP_URL }}
          UPDATE_URL: ${{ secrets.UPDATE_NSP_URL }}
          KEYS_URL: ${{ secrets.PROD_KEYS_URL }}
        run: |
          mkdir -p ~/GameInput ~/Keys
          gdown "$(echo "$GAME_URL" | tr -d '[:space:]')" -O ~/GameInput/fifa22_base.nsp
          gdown "$(echo "$UPDATE_URL" | tr -d '[:space:]')" -O ~/GameInput/fifa22_update_1.0.5.nsp
          gdown "$(echo "$KEYS_URL" | tr -d '[:space:]')" -O ~/Keys/prod.keys
          ls -lh ~/GameInput ~/Keys
          file ~/GameInput/*
          if file ~/GameInput/fifa22_base.nsp | grep -qi "RAR archive"; then
            mv ~/GameInput/fifa22_base.nsp ~/GameInput/base.rar
            unrar x -o+ ~/GameInput/base.rar ~/GameInput/
            rm ~/GameInput/base.rar
          fi

      - name: Build unsigned IPA with separate RomFS
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/GameInput -k ~/Keys/prod.keys --romfs separate

      - name: Upload IPA and RomFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fifa22-ipa-and-romfs
          path: |
            ~/GameInput/*.ipa
            ~/GameInput/romfs

name: Build FIFA 22 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Free up disk space on runner
        run: |
          sudo rm -rf /Applications/Xcode_15*.app
          sudo rm -rf /Users/runner/Library/Android
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install xcodegen zstd glslang jq
          brew install --cask dotnet-sdk
          python3 -m pip install --break-system-packages lz4 "capstone>=5,<6" fonttools nsz zbic gdown

      - name: Download game files, update, and keys
        env:
          GAME_URL: ${{ secrets.GAME_NSP_URL }}
          UPDATE_URL: ${{ secrets.UPDATE_NSP_URL }}
          KEYS_URL: ${{ secrets.PROD_KEYS_URL }}
        run: |
          mkdir -p ~/GameInput ~/Keys

          # Download Base Game from Gofile
          GOFILE_ID=$(basename "$GAME_URL")
          GOFILE_TOKEN=$(curl -s -X POST https://gofile.io | jq -r '.data.token')
          DIRECT_URL=$(curl -s -H "Authorization: Bearer $GOFILE_TOKEN" "https://gofile.io" | jq -r '.data.children | to_entries[0].value.link')
          curl -fL -H "Cookie: accountToken=$GOFILE_TOKEN" "$DIRECT_URL" -o ~/GameInput/fifa22_base.nsp

          # Download Update 1.0.5 from Google Drive
          gdown "$UPDATE_URL" -O ~/GameInput/fifa22_update_1.0.5.nsp

          # Download prod.keys from Dropbox
          curl -fL "$KEYS_URL" -o ~/Keys/prod.keys

          ls -lh ~/GameInput ~/Keys

      - name: Build unsigned IPA with separate RomFS
        run: |
          python3 scripts/build_ipa_from_nsp.py ~/GameInput -k ~/Keys/prod.keys --romfs separate

      - name: Upload IPA and RomFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fifa22-ipa-and-romfs
          path: |
            ~/GameInput/*.ipa
            ~/GameInput/romfs

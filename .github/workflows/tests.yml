name: Build FIFA 22 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free Up Disk Space
        run: |
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf /Library/Developer/CoreSimulator/Volumes/*
          sudo rm -rf /Library/Developer/CoreSimulator/Caches/*
          brew cleanup --prune=0 2>/dev/null || true
          df -h

      - name: Setup Tools & gdown
        run: |
          python3 -m pip install --upgrade pip gdown
          brew install cmake ninja

      - name: Download Files from Google Drive
        run: |
          mkdir -p files
          gdown --fuzzy "${{ secrets.PROD_KEYS_URL }}" -O files/prod.keys
          gdown --fuzzy "${{ secrets.GAME_URL }}" -O files/game.nsp
          gdown --fuzzy "${{ secrets.UPDATE_URL }}" -O files/update.nsp
          
          # Verify no HTML error pages were downloaded instead of real files
          for f in files/*; do
            if head -c 100 "$f" | grep -qi "<!DOCTYPE html>"; then
              echo "ERROR: $f downloaded an HTML page. Check Google Drive 'Anyone with the link' permissions!"
              exit 1
            fi
          done
          ls -lh files/

      - name: Build IPA
        run: |
          if [ -f "scripts/build_ipa.py" ]; then
            python3 scripts/build_ipa.py --keys files/prod.keys --game files/game.nsp --update files/update.nsp --output FIFA22.ipa
          elif [ -f "build_ipa.py" ]; then
            python3 build_ipa.py --keys files/prod.keys --game files/game.nsp --update files/update.nsp --output FIFA22.ipa
          elif [ -f "build.py" ]; then
            python3 build.py --keys files/prod.keys --game files/game.nsp --update files/update.nsp --output FIFA22.ipa
          else
            echo "Listing repo files to check structure:"
            ls -la
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FIFA22-IPA
          path: "**/*.ipa"
          retention-days: 5
